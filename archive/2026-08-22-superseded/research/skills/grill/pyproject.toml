# grill skill：每轮一次 rlm() 攻击（prompt-blinded），typed 结果落盘回传。
[project]
name = "grill"
version = "0.1.0"
description = "Crucible 研究战役：grill——对 claim_view 的结构化攻击，结果必须以 typed entry 落回 register"
requires-python = ">=3.11"
dependencies = ["register"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grill"]

[tool.pytest.ini_options]
testpaths = ["test"]
