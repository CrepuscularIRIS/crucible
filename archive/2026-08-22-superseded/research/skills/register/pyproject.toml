# register skill 的 kernel 侧包。只依赖标准库（宿主 gates 可复刻同样的重算逻辑）；
# prime-agent-runtime 仅在 kernel 内存在，不声明为依赖（未发布到 PyPI）。
[project]
name = "register"
version = "0.1.0"
description = "Crucible 研究战役：信念状态寄存器（claim/probe 状态机 + 四验证器 + journal）"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/register"]

[tool.pytest.ini_options]
testpaths = ["test"]
