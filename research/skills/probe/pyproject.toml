# probe skill：唯一受认可的执行路径（git worktree + 冻结 eval + provenance）。
[project]
name = "probe"
version = "0.1.0"
description = "Crucible 研究战役：probe.run——冻结 eval 命令在独立 worktree 中执行，产物带 provenance"
requires-python = ">=3.11"
dependencies = ["register"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.pytest.ini_options]
testpaths = ["test"]
