[project]
name = "research-kit"
version = "0.2.0"
description = "Read-only kernel toolkit for the Proma research layer (anchor / claim_view / disjoint_pairs / calibration)"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_kit"]
